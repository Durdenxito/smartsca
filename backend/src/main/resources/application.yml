spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  application:
    name: smartsca
  datasource:
    url: ${SMARTSCA_DB_URL:jdbc:postgresql://localhost:5432/smartsca}
    username: ${SMARTSCA_DB_USER:smartsca}
    password: ${SMARTSCA_DB_PASSWORD:${POSTGRES_PASSWORD:}}
    hikari:
      connection-timeout: 5000
  jpa:
    open-in-view: false
    properties:
      hibernate.type.json_format_mapper: jackson3
    hibernate:
      ddl-auto: validate

smartsca:
  imports-root: ${SMARTSCA_IMPORTS:../.smartsca/projects}
  fixtures-root: ${SMARTSCA_FIXTURES:../fixtures}
  enrichment:
    enabled: ${SMARTSCA_ENRICHMENT_ENABLED:true}
