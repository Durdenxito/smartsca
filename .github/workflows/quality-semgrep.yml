name: Calidad semgrep

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "scripts/quality/**"
      - ".github/workflows/quality-semgrep.yml"
      - "frontend/**"
      - "infra/**"
      - "scripts/docs/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "backend/**"
      - "scripts/quality/**"
      - ".github/workflows/quality-semgrep.yml"
      - "frontend/**"
      - "infra/**"
      - "scripts/docs/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: quality-semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Comprobar generación y comparación de reportes
        run: python3 -m unittest discover -s scripts/quality -p 'test_*.py'
      - name: Recuperar solo una línea base anterior de main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/quality/baseline.py semgrep --output quality-output
      - name: Instalar Semgrep CE fijado
        run: python3 -m pip install semgrep==1.180.0
      - name: Analizar y generar reporte
        run: python3 scripts/quality/scan.py semgrep --output quality-output
      - name: Conservar diagnóstico si no se pudo ejecutar el analizador
        if: always()
        run: python3 scripts/quality/report.py semgrep --output quality-output
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: quality-semgrep
          retention-days: 90
          if-no-files-found: error
          path: |
            quality-output/report.json
            quality-output/report.md
            quality-output/raw-*.json
            quality-output/rules.yml
            quality-output/scan*.log
