name: Calidad snyk

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "scripts/quality/**"
      - ".github/workflows/quality-snyk.yml"
      - "frontend/package*.json"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: quality-snyk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Comprobar generación y comparación de reportes
        run: python3 -m unittest discover -s scripts/quality -p 'test_*.py'
      - name: Recuperar solo una línea base anterior de main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/quality/baseline.py snyk --output quality-output
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Instalar Snyk CLI fijado
        run: npm install --global snyk@1.1307.4
      - name: Analizar y generar reporte
        env:
          SNYK_TOKEN: ${{ github.event_name != 'pull_request' && secrets.SNYK_TOKEN || '' }}
        run: python3 scripts/quality/scan.py snyk --output quality-output
      - name: Conservar diagnóstico si no se pudo ejecutar el analizador
        if: always()
        run: python3 scripts/quality/report.py snyk --output quality-output
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: quality-snyk
          retention-days: 90
          if-no-files-found: error
          path: |
            quality-output/report.json
            quality-output/report.md
            quality-output/raw-*.json
            quality-output/rules.yml
            quality-output/scan*.log
