name: Documentación técnica en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/docs/**'
      - '.github/workflows/technical-pages.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/docs/**'
      - '.github/workflows/technical-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: technical-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository_owner == 'Durdenxito'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            scripts/docs/package-lock.json
      - name: Generar Javadoc de clases, métodos y propiedades
        working-directory: backend
        run: >-
          ./mvnw -B -ntp org.apache.maven.plugins:maven-javadoc-plugin:3.12.0:javadoc
          -Dshow=private -Ddoclint=all,-missing -DfailOnWarnings=false
      - name: Generar TypeDoc del frontend
        run: |
          npm ci --prefix frontend
          npm ci --prefix scripts/docs
          npm run api --prefix scripts/docs
      - name: Preparar portal técnico
        run: |
          mkdir -p build/site/backend
          cp -a backend/target/reports/apidocs/. build/site/backend/
          test -f build/site/backend/index.html
          test -f build/site/frontend/index.html
          python3 scripts/docs/site.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: technical-documentation
          path: build/site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: build/site

  deploy:
    if: github.repository_owner == 'Durdenxito' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
