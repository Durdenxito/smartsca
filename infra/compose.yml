services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: smartsca
      POSTGRES_USER: smartsca
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting PostgreSQL}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
